<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSpend | AI Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar glass">
        <div class="brand">
          <span class="brand-icon">💸</span>
          <h1>SmartSpend</h1>
        </div>
        <p class="tagline">Track expenses. Let AI do the sorting.</p>

        <form id="transaction-form" autocomplete="off">
          <h2>Add Transaction</h2>

          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />

          <label for="description">Description</label>
          <input
            type="text"
            id="description"
            name="description"
            placeholder="e.g. Starbucks, Uber ride"
            maxlength="200"
            required
          />

          <label for="amount">Amount (₹)</label>
          <input
            type="number"
            id="amount"
            name="amount"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          />

          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">Auto-detect with AI</option>
            <option value="Transport">Transport</option>
            <option value="Food &amp; Dining">Food &amp; Dining</option>
            <option value="Groceries">Groceries</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
          </select>

          <button type="submit" id="submit-btn">Add Transaction</button>
          <p id="form-message" class="form-message" role="status"></p>
        </form>
      </aside>

      <main class="content">
        <section class="stats">
          <div class="card glass stat-card">
            <span class="stat-label">Total Spending</span>
            <span class="stat-value" id="total-spending">$0.00</span>
            <span class="stat-sub" id="transaction-count">0 transactions</span>
          </div>
          <div class="card glass stat-card">
            <span class="stat-label">Top Category</span>
            <span class="stat-value" id="top-category">—</span>
            <span class="stat-sub" id="top-category-amount">$0.00</span>
          </div>
        </section>

        <section class="card glass insights">
          <div class="insights-header">
            <span class="badge">AI Insights</span>
          </div>
          <p id="ai-insights-box">Analysing your spending…</p>
        </section>

        <section class="data-grid">
          <div class="card glass table-card">
            <h2>Transaction History</h2>
            <div class="table-wrapper">
              <table id="transactions-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th class="num">Amount</th>
                  </tr>
                </thead>
                <tbody id="transactions-body">
                  <tr>
                    <td colspan="4" class="empty">Loading…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card glass chart-card">
            <h2>Category Breakdown</h2>
            <div class="chart-container">
              <canvas id="category-chart"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
